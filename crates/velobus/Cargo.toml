[package]
name = "nodara"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Experimental bounded binary request/reply intermediary"

[dependencies]
bytes = "1"
crc32fast = "1"
fs2 = "0.4"
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
